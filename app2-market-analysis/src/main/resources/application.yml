# ============================================================
# application.yml — App2 Spring Boot 配置
# ============================================================

server:
  port: 8002

spring:
  application:
    name: app2-market-analysis
  # 缓存配置：Caffeine 本地缓存
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=5m,maximumSize=100

# Task 1 ML 模型容器地址
# Docker Compose 中通过环境变量 APP_TASK1_BASE_URL 覆盖
app:
  task1:
    base-url: http://localhost:8000
    timeout:
      connect-seconds: 5   # Task 1 连接超时
      read-seconds: 10     # Task 1 响应读取超时

# Actuator 端点暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 生产建议 when-authorized；本地演示用 always 便于调试
      show-details: when-authorized

# 日志
logging:
  level:
    com.interview.marketanalysis: INFO
    org.springframework.web: INFO
