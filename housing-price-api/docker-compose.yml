# ============================================================
# docker-compose.yml — 房价预测 API
#
# FastAPI 预测 API 的单服务编排。
# 模型构件必须通过 `python train.py` 预先生成，
# 然后才能执行 `docker compose up --build`。
# ============================================================

services:
  api:
    build: .
    container_name: housing-price-api
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
