# ============================================================
# docker-compose.yml — Task 2 统一门户（全栈编排）
#
# 一键启动 4 个服务：
#   1. housing-predictor  — Task 1 ML 模型 (port 8000)
#   2. app1-backend        — App1 FastAPI 后端 (port 8001)
#   3. app2-backend        — App2 Spring Boot 后端 (port 8002)
#   4. portal              — Next.js 统一前端 (port 3000)
#
# 前置条件：
#   1. Task 1 模型已训练：cd housing-price-api && python train.py
#   2. 各子项目的 Dockerfile 已就绪
#
# 使用方式：
#   docker compose up --build
# ============================================================

services:

  # ------------------------------------------------------------------
  # Task 1: 房价预测 ML 模型（基础能力层）
  # ------------------------------------------------------------------
  housing-predictor:
    build:
      context: ./housing-price-api
      dockerfile: Dockerfile
    container_name: housing-predictor
    ports:
      - "8000:8000"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # App1 后端: Property Value Estimator（Python FastAPI 薄代理层）
  # ------------------------------------------------------------------
  app1-backend:
    build:
      context: ./app1-property-estimator
      dockerfile: Dockerfile
    container_name: app1-backend
    ports:
      - "8001:8001"
    networks:
      - app-network
    environment:
      - TASK1_BASE_URL=http://housing-predictor:8000
    depends_on:
      housing-predictor:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/app1/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # App2 后端: Property Market Analysis（Java Spring Boot）
  # ------------------------------------------------------------------
  app2-backend:
    build:
      context: ./app2-market-analysis
      dockerfile: Dockerfile
    container_name: app2-backend
    ports:
      - "8002:8002"
    networks:
      - app-network
    environment:
      - APP_TASK1_BASE_URL=http://housing-predictor:8000
    depends_on:
      housing-predictor:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/api/app2/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Portal: Next.js 统一前端
  # ------------------------------------------------------------------
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: portal
    ports:
      - "3000:3000"
    networks:
      - app-network
    environment:
      - NEXT_PUBLIC_APP1_URL=http://app1-backend:8001
      - NEXT_PUBLIC_APP2_URL=http://app2-backend:8002
    depends_on:
      - app1-backend
      - app2-backend
    restart: unless-stopped

# ==================================================================
# 网络
# ==================================================================
networks:
  app-network:
    driver: bridge
    name: app-network
